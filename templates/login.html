<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 - RBAC 权限管理平台</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/assets/css/style.css" rel="stylesheet">
  <style>
    .login-page .login-card .card-body .form-control {
      height: 44px;
      font-size: 14px;
      border-radius: .5rem;
      padding-left: 2.4rem;
    }
    .login-page .login-card .card-body .form-control.has-toggle {
      padding-right: 2.6rem;
    }
    .login-page .login-card .card-body .input-icon {
      position: absolute;
      z-index: 4;
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 0 .75rem;
      height: 44px;
      display: flex;
      align-items: center;
      pointer-events: none;
    }
    .login-field {
      position: relative;
    }
    .login-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 1.25rem;
    }
    .login-options .form-check-label {
      color: #64748b;
    }
    .login-options a {
      color: var(--sidebar-active);
      text-decoration: none;
      font-size: 13px;
    }
    .login-options a:hover {
      text-decoration: underline;
    }
    .login-divider {
      display: flex;
      align-items: center;
      gap: .75rem;
      margin: 1.5rem 0;
      font-size: 12.5px;
      color: #94a3b8;
    }
    .login-divider::before,
    .login-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #e2e8f0;
    }
    .social-login {
      display: flex;
      justify-content: center;
      gap: 1rem;
    }
    .social-login .social-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid #e2e8f0;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      color: #475569;
      transition: all .15s;
    }
    .social-login .social-btn:hover {
      border-color: var(--sidebar-active);
      color: var(--sidebar-active);
      background: #eff6ff;
    }
    .login-footer {
      text-align: center;
      font-size: 12px;
      color: #94a3b8;
      margin-top: 1.5rem;
    }
    .login-footer a {
      color: #64748b;
      text-decoration: none;
    }
    .login-footer a:hover {
      color: #334155;
    }
    .password-toggle {
      position: absolute;
      right: 0;
      top: 0;
      z-index: 4;
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      height: 44px;
      width: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }
    .password-toggle:hover {
      color: #475569;
    }
    /* 验证码 */
    .captcha-box {
      display: flex;
      gap: .75rem;
      align-items: flex-end;
    }
    .captcha-box .form-floating {
      flex: 1;
    }
    .captcha-img {
      height: 44px;
      width: 120px;
      border-radius: .5rem;
      border: 1px solid #e2e8f0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #e0e7ff, #f0f4ff);
      font-family: "Consolas", "Courier New", monospace;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: .2em;
      color: #334155;
      user-select: none;
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
    }
    .captcha-img::after {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        45deg,
        transparent,
        transparent 3px,
        rgba(59, 130, 246, .06) 3px,
        rgba(59, 130, 246, .06) 6px
      );
    }
    .btn-login {
      height: 46px;
      font-size: 15px;
      font-weight: 600;
      border-radius: .5rem;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      border: none;
      transition: all .2s;
    }
    .btn-login:hover {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(37, 99, 235, .35);
    }
    .btn-login:active {
      transform: translateY(0);
    }
    /* demo 提示 */
    .demo-hint {
      background: rgba(255, 255, 255, .08);
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: .6rem;
      padding: .85rem 1rem;
      font-size: 13px;
      color: #cbd5e1;
      margin-top: 1rem;
    }
    .demo-hint code {
      background: rgba(255, 255, 255, .12);
      padding: .1em .4em;
      border-radius: .3rem;
      font-size: 12px;
      color: #fff;
    }
    @media (max-width: 575.98px) {
      .login-card {
        max-width: 100%;
      }
      .login-card .card-body {
        padding: 1.35rem;
      }
    }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="login-card card">
      <!-- 品牌区 -->
      <div class="login-brand">
        <i class="bi bi-shield-lock"></i>
        <h5>RBAC 权限管理平台</h5>
        <p>基于角色的访问控制管理系统</p>
      </div>

      <!-- 登录表单 -->
      <div class="card-body">
        <form id="loginForm" onsubmit="return false;">
          <!-- 账号 -->
          <div class="login-field mb-3">
            <span class="input-icon"><i class="bi bi-person"></i></span>
            <input type="text" class="form-control" id="username" placeholder="请输入账号" value="admin" autocomplete="username">
          </div>

          <!-- 密码 -->
          <div class="login-field mb-3">
            <span class="input-icon"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control has-toggle" id="password" placeholder="请输入密码" value="admin123" autocomplete="current-password">
            <button type="button" class="password-toggle" id="togglePwd" tabindex="-1">
              <i class="bi bi-eye"></i>
            </button>
          </div>

          <!-- 验证码 -->
          <div class="captcha-box mb-3">
            <div style="flex:1;">
              <input type="text" class="form-control" id="captcha" placeholder="请输入验证码" maxlength="4" autocomplete="off">
            </div>
            <div class="captcha-img" id="captchaImg" title="点击刷新验证码">
              <img src="" alt="验证码" style="width:100%;height:100%">
              <input type="hidden" name = "captcha_key" id="captcha_key" value="">
            </div>
          </div>

          <!-- 记住我 & 忘记密码 -->
          <div class="login-options">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="rememberMe" checked>
              <label class="form-check-label" for="rememberMe">记住登录状态</label>
            </div>
            <a href="#">忘记密码？</a>
          </div>

          <!-- 登录按钮 -->
          <button type="submit" class="btn btn-primary btn-login w-100" id="btnLogin">
            <i class="bi bi-box-arrow-in-right me-1"></i>登 录
          </button>
        </form>

        <!-- 第三方登录 -->
        <div class="login-divider">其他登录方式</div>
        <div class="social-login">
          <button type="button" class="social-btn" title="企业微信登录">
            <i class="bi bi-wechat"></i>
          </button>
          <button type="button" class="social-btn" title="钉钉登录">
            <i class="bi bi-tencent-qq"></i>
          </button>
          <button type="button" class="social-btn" title="飞书登录">
            <i class="bi bi-phone"></i>
          </button>
          <button type="button" class="social-btn" title="LDAP 登录">
            <i class="bi bi-building"></i>
          </button>
        </div>

        <div class="login-footer">
          <span>还没有账号？</span><a href="#">联系管理员</a>
          <span class="mx-2">|</span>
          <a href="/">返回首页</a>
        </div>
      </div>
    </div>

    <!-- 演示提示 -->
    <div class="demo-hint" style="position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);max-width:400px;width:calc(100% - 2rem);text-align:center;">
      <i class="bi bi-info-circle me-1"></i>演示环境 · 默认账号 <code>admin</code> 密码 <code>admin123</code>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/axios.min.js"></script>
  <script>
    (function () {
      "use strict";

      /* 密码显隐 */
      var toggleBtn = document.getElementById("togglePwd");
      var pwdInput = document.getElementById("password");
      if (toggleBtn && pwdInput) {
        toggleBtn.addEventListener("click", function () {
          var isHidden = pwdInput.type === "password";
          pwdInput.type = isHidden ? "text" : "password";
          toggleBtn.innerHTML = isHidden
            ? '<i class="bi bi-eye-slash"></i>'
            : '<i class="bi bi-eye"></i>';
        });
      }

      /* 验证码刷新 */
      function randomCaptcha() {

        axios.get("/captcha?width=120&height=42&spacing=2").then(response =>{
          //获取结果
          let  data = response.data;
          // console.log(data);
          var captchaEl = document.getElementById("captchaImg");
          captchaEl.querySelector("img").src = data.url;
          captchaEl.querySelector("input[name='captcha_key']").value = data.name;
        })
        
      }
      //进页面加载图片
      window.onload = randomCaptcha;
      var captchaEl = document.getElementById("captchaImg");
      captchaEl.addEventListener("click", function () {
            randomCaptcha();
        });
      

      /* 登录 */
      var loginForm = document.getElementById("loginForm");
      if (loginForm) {
        loginForm.addEventListener("submit", function (e) {
          e.preventDefault();
          let username = document.getElementById("username").value.trim();
          let password = document.getElementById("password").value;
          // 获取验证码 对应的 key
          let captchaKey = document.querySelector("#captcha_key").value;
          // 获取 输入的验证码
          let captcha =  document.querySelector("#captcha").value;
          //获取 是否选中 记住我
          let rememberMe = document.querySelector("#rememberMe").checked;

          if(!username) {shakeField('username');return;}
          if(!password) {shakeField('password');return;}
          if(!captcha) {shakeField('captcha');return;}
          var btn = document.getElementById("btnLogin");
          btn.disabled = true;
          btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>登录中…';
          //发起 异步请求、调用接口 完成用户登录
          //axios 对普通对象会自动编码成 JSON、后端用 json.loads(request.body) 解析
          axios.post('/login', {username,password,captchaKey,captcha,rememberMe:rememberMe ? "on" : "off"},{
            headers:{
               "Content-Type":"application/x-www-form-urlencoded"
            }
          }).then(response => {
              window.location.href = "/";
          }).catch(error => {
              btn.disabled = false;
              btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i>登 录';
              showToast(error.response?.data.message || "登录失败，请检查账号密码和验证码");
              // 登录失败后刷新验证码
              randomCaptcha();
          })
        });
      }

      /* 抖动动画 */
      function shakeField(id) {
        var el = document.getElementById(id);
        if (!el) return;
        el.style.borderColor = "#ef4444";
        var field = el.closest(".login-field");
        if (field) field.style.animation = "shake .4s";
        setTimeout(function () {
          el.style.borderColor = "";
          if (field) field.style.animation = "";
        }, 500);
        el.focus();
      }

      /* Toast */
      function showToast(msg) {
        var el = document.createElement("div");
        el.className = "rbac-toast";
        el.innerHTML = '<i class="bi bi-exclamation-circle me-2"></i>' + msg;
        document.body.appendChild(el);
        requestAnimationFrame(function () { el.classList.add("show"); });
        setTimeout(function () {
          el.classList.remove("show");
          setTimeout(function () { el.remove(); }, 300);
        }, 2500);
      }

      /* 抖动 keyframes */
      var style = document.createElement("style");
      style.textContent = "@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}";
      document.head.appendChild(style);
    })();
  </script>
</body>
</html>
